<section class="homemade-specialties-section" id="homemade-specialties" aria-label="Homemade Specialties">
  <div class="container">
    
    <!-- Section Header -->
    <div class="section-header text-center">
      <div class="kicker">
        <span>OUR CULINARY PROMISE</span>
      </div>
      <h2 class="display-title-xl">
        Made Like Home. <br>
        <span class="text-gradient-maroon">Served With Pride.</span>
      </h2>
      <div class="divider-gold">
        <i class="fas fa-heart" aria-hidden="true"></i>
      </div>
      <p class="section-subtitle">
        We treat every catering event as if cooking for our own family. Discover the three sacred pillars that set Sri Srinivasa Caters apart.
      </p>
    </div>

    <!-- 3 Editorial Specialty Cards with Close-Up Imagery -->
    <div class="specialties-grid">
      <div *ngFor="let item of specialties" class="specialty-editorial-card">
        <div class="specialty-image-wrapper frame-gold-border">
          <img [src]="item.image" [alt]="item.title" loading="lazy" />
          <div class="specialty-overlay"></div>
          <span class="specialty-badge">{{ item.badge }}</span>
          <span class="specialty-numeral">{{ item.id }}</span>
        </div>
        
        <div class="specialty-body">
          <h3 class="specialty-title">{{ item.title }}</h3>
          <p class="specialty-desc">{{ item.desc }}</p>
        </div>
      </div>
    </div>

  </div>
</section>
