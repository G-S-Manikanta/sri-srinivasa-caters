<section #trackContainer class="tradition-pinned-track" id="tradition-scene" aria-label="Tradition Scene">
  <div class="sticky-viewport-canvas">
    
    <!-- Background Environmental Layer -->
    <div class="canvas-bg-env">
      <img
        src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80&w=2600&auto=format&fit=crop"
        alt="Traditional South Indian Wedding Environment"
        class="env-image"
        [style.transform]="'scale(' + (1.05 + scrollProgress * 0.12) + ')'"
        loading="lazy"
      />
      <div class="env-overlay-silk"></div>
    </div>

    <!-- Midground Floating Traditional Objects (Parallax) -->
    <div class="canvas-midground-layer" aria-hidden="true">
      <!-- Drifting Brass Urli Object -->
      <div
        class="floating-brass-urli"
        [style.transform]="'translate3d(' + (scrollProgress * -80) + 'px, ' + (scrollProgress * 40) + 'px, 0)'"
      >
        <div class="urli-glow"></div>
      </div>

      <!-- Marigold & Jasmine Floral Stream -->
      <div
        class="floating-marigold"
        [style.transform]="'translate3d(' + (scrollProgress * 120) + 'px, ' + (scrollProgress * -60) + 'px, 0)'"
      ></div>
    </div>

    <!-- Giant Horizontal Typography Stream -->
    <div
      class="giant-horizontal-text-track"
      [style.transform]="'translate3d(' + (scrollProgress * -45) + '%, 0, 0)'"
      aria-hidden="true"
    >
      <span class="giant-word stroke-text">TRADITION</span>
      <span class="giant-word solid-text text-gradient-gold">PARAMAPARA</span>
      <span class="giant-word stroke-text">HERITAGE</span>
    </div>

    <!-- Foreground Content Layer -->
    <div class="canvas-foreground-container">
      <div class="container tradition-inner-flex">
        
        <!-- Top Editorial Kicker -->
        <div class="tradition-header">
          <span class="kicker kicker-gold">SCENE 02 — THE VEDIC FOUNDATION</span>
          <h2 class="tradition-sub-title">Where Generations Gather</h2>
        </div>

        <!-- Center Active Theme Quadrant -->
        <div class="tradition-words-carousel">
          <div
            *ngFor="let item of subWords; let i = index"
            class="theme-word-row"
            [class.is-active]="i === activeSubWord"
          >
            <span class="theme-num">0{{ i + 1 }}</span>
            <div class="theme-info">
              <h3 class="theme-heading">{{ item.text }}</h3>
              <p class="theme-desc">{{ item.desc }}</p>
            </div>
          </div>
        </div>

        <!-- Bottom Heritage Footnote -->
        <div class="tradition-bottom-bar">
          <div class="progress-line-track">
            <div class="progress-line-fill" [style.width]="(scrollProgress * 100) + '%'"></div>
          </div>
          <span class="footnote-label">SCROLL TO WITNESS THE FEAST UNFOLD</span>
        </div>

      </div>
    </div>

  </div>
</section>
