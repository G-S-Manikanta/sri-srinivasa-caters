<section #weddingTrack class="wedding-scene-track" id="wedding-scene" aria-label="Wedding Experience Scene">
  <div class="wedding-sticky-viewport">
    
    <!-- Primary Visual (Mandapam Scene with dynamic scale) -->
    <div
      class="wedding-visual-layer primary"
      [style.transform]="'scale(' + (0.92 + scrollProgress * 0.18) + ')'"
      [style.opacity]="1 - scrollProgress * 0.75"
    >
      <img
        src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80&w=2600&auto=format&fit=crop"
        alt="Grand South Indian Wedding Mandapam and Silk Sarees"
        class="scene-img"
        loading="lazy"
      />
      <div class="scene-overlay-maroon"></div>
    </div>

    <!-- Secondary Visual (Enters during scroll: Dining Transition) -->
    <div
      class="wedding-visual-layer secondary"
      [style.transform]="'translate3d(0, ' + ((1 - scrollProgress) * 40) + 'px, 0) scale(' + (1.08 - scrollProgress * 0.08) + ')'"
      [style.opacity]="scrollProgress * 1.2"
    >
      <img
        src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?q=80&w=2600&auto=format&fit=crop"
        alt="South Indian Wedding Feast Dining Hall"
        class="scene-img"
        loading="lazy"
      />
      <div class="scene-overlay-dark"></div>
    </div>

    <!-- Oversized Editorial Typography Layer -->
    <div class="wedding-typography-layer">
      <div class="container wedding-text-box">
        
        <div class="kicker kicker-gold">
          <span>SCENE 03 — AUSPICIOUS CELEBRATIONS</span>
        </div>

        <h2
          class="wedding-giant-title"
          [style.transform]="'translate3d(' + (scrollProgress * -30) + 'px, 0, 0)'"
        >
          FOR EVERY<br>
          <span class="text-gradient-gold">CELEBRATION</span>
        </h2>

        <p class="wedding-narrative-lead">
          From sacred Vedic Muhurtham vows to grand evening receptions, we create feasts that become cherished family folklore.
        </p>

        <div class="wedding-pills-row">
          <span class="badge-cultural"><i class="fas fa-gem"></i> Silk Saree & Dhoti Tradition</span>
          <span class="badge-cultural"><i class="fas fa-users"></i> Up to 10,000+ Guests</span>
          <span class="badge-cultural"><i class="fas fa-award"></i> 25+ Years of Trust</span>
        </div>

      </div>
    </div>

  </div>
</section>
